[package]
name = "eventbadges"
version = "0.0.0"
edition = "2021"
publish = false
description = "Non-transferable event attendance badges on Stellar (Soroban contract, testnet v0)"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# Pinned to the major version the Stellar CLI toolchain verifies against.
# The SDK version in use is recorded in the README; re-check it against
# developers.stellar.org before upgrading.
soroban-sdk = "28"

[dev-dependencies]
soroban-sdk = { version = "28", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://developers.stellar.org/docs/build/smart-contracts/example-contracts/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
